<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <h2>Tag <code>&lt;select&gt;</code></h2>
    <fieldset>
 <legend>Linguagens</legend>
<!--select-->
<select>

    <optgroup label="Front-end">
        <option>HTML</option>
        <option>CSS</option>
        <option>Javascript</option>
    </optgroup>

    <optgroup label="Back-end">
        <option>C#</option>
        <option>php</option>
        <option>Java</option>
    </optgroup>

</select>
</fieldset>

<br>

<h2>Tag <code>&lt;datalist&gt;</code></h2>

<fieldset>
    <legend>Frutas</legend>
    <!--datalist - conexão list(input) com id(datalist) -->
    <input type="text" name="" id="" list="frutas">
    <datalist id="frutas">
        <option>Morango</option>
        <option>Manga</option>
        <option>Limão</option>
        <option>Uva</option>
        <option>Maça</option>
        <option>Banana</option>
        <option>Maracujá</option>
    </datalist>
</fieldset>
</body>
</html>
