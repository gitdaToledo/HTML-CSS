<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumo de Tags de formatação - HTML </title>
</head>
<body>

    <h1 style="text-align: center;">Resumo das Tags de Formatação</h1>

    <ul>
        <li>
            <p title="tag <p>">Parágrafo</p>
           <li> <p title="tag <em>">Itálico</p>
           <li> <p title="tag <strong>">Negrito</p>
           <li> <p title="tag <mark>">Marcação de texto</p>
           <li> <p title="tag <del>">Texto riscado</p>
           <li> <p title="tag <ins>">Texto sublinhado</p>
           <li> <p title="tag <sup>">Texto elevado</p>
           <li> <p title="tag <sub>">Texto em baixo</p>
           <li> <p title="tag <code>">Código em linha</p>
          <li> <p title="tag <pre>">Código pré-formatado</p>
           <li> <p title="tag <q>">Citação em linha</p>
          <li>  <p title="tag <blockquote>">Citação em bloco</p>
          <li>  <p title="tag <abbr>">Abreviação</p>    
        
    </ul>
</body>
</html>
