<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css" media="all"> <!--estiliza tudo-->

    <!--and = add uma informação-->
    <!--media feature fica entre parenteses ()-->
    <link rel="stylesheet" href="retrato.css" media="screen and (orientation: portrait)">
    <link rel="stylesheet" href="paisagem.css" media="screen and (orientation: landscape)">

     <!--Chamando as medias queries = media type + media feature-->

    <title>Media Query</title>
</head>
<body>

    <h1>Mude a orientação do celular</h1>
    
</body>
</html>
