<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Prática 2</title>

    <style>
        .container{
            display:flex;
            background-color:rgb(16, 5, 120);
            border-radius:5px;
            margin:10px;
            align-items: stretch;
            padding:10px;
            height: 300px;
  justify-content:space-between; 
        }

        .item{
            background-color: lightskyblue;
            width: 50px;
            padding:10px;
            border:1px solid black;
            border-radius:8px;
            text-align: center;
            align-content: center;
            margin: 10px;

          
        }
    </style>
</head>
<body>
    <h1>Alinhamento dos eixos - Flexbox</h1>
<h2>centralizando itens</h2>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div> 
    </div>

</body>
</html>
