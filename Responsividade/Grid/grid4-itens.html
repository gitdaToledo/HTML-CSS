<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 4 - itens</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            background-color: lightgreen;
        }

        .container{
            background-color: azure;
            margin: 10px;
            padding: 20px;

            /*uso de grid*/
            display: grid;
            gap: 10px;

            /*propriedades simplificadas do grid*/
            grid-template: repeat(3, 100px) / repeat(4, 1fr);

           
        }

        .item{
            border: 2px solid rgb(42, 138, 42);
            padding: 8px;
            display:flex;
            justify-content: center;
            align-items: center;
            cursor: pointer; 
        }

        .item:hover{
            background-color: rgb(42, 138, 42);
        }

         /*grid itens*/
        #header{
            grid-row: 1 / 2;
            grid-column: 1 / -1;
        }

        #caixa1{
            grid-row: 2 / 4;
            grid-column: 1 / 3;
        }

        #caixa2{
            grid-row: 2 / 4;
            grid-column: 3 / 5;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="item" id="header">Header</div>
        <div class="item" id="caixa1">Caixa1</div>
        <div class="item" id="caixa2">Caixa2</div>
    </div>
    
</body>
</html>
