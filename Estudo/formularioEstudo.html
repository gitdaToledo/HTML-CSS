<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
         body {
               background-image: linear-gradient(to right, rgb(226, 97, 119), rgb(225, 181, 188));
        
        }

        form{
            background-color: white;
            display: block;
            margin:auto;
            margin-top: 25px;
            width:50%;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        button{
            background-color:pink;
            border: 0;
            padding:8px;
            border-radius: 5px;
            width: 80px;
            cursor: pointer;
            display:flex;
            margin:auto;
            text-align: center;
        }

        input{
            border-bottom: 1px solid black;
            padding: 5px;
            border: none;
            width: auto;
        }
    </style>
</head>

<body>

    <form action="http://localhost/estudoProva.php" method="post">

<!--conexão for (label) com id (input)-->

        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" required>
<br><br>
        <label for="idade">Idade:</label>
        <input type="number" name="idade" id="idade" min="17" required>
<br><br>
        <label for="tel">Telefone:</label>
        <input type="tel" name="tel" id="tel" placeholder="(xx) xxxxx-xxxx" required>
<br><br>
        <label for="data">Data da Prova:</label>
        <input type="date" name="data" id="data" min="2026-05-05" required>
<br><br>
        <label for="nota">Nota (0 a 10)</label>   <br>     
        <input type="range" name="nota" id="nota" min="0" max="10" step="1" required>
<br><br>
    <!--checkbox - names iguais com [] e add value em cada opção-->
        <label for="materia">Matérias:</label> <br>
        <input type="checkbox" name="materias[]" id="materia1" value="APRG"><label>APRG</label><br>
        <input type="checkbox" name="materias[]" id="materia2" value="HTCT"><label>HTCT</label><br>
        <input type="checkbox" name="materias[]" id="materia3" value="DWEB"><label>DWEB</label><br>
        <input type="checkbox" name="materias[]" id="materia4" value="FMAT"><label>FMAT</label><br>
        <input type="checkbox" name="materias[]" id="materia5" value="ARQ"><label>ARQ</label><br>
        <input type="checkbox" name="materias[]" id="materia6" value="PRESS"><label>PRESS</label>
<br><br>
    <!--radio - os names devem ser iguais add value-->
        <label>Escolha 1</label> <br>
        <input type="radio" name="genero" id="generoM" value="m"><label for="generoM">Masculino</label>    
        <input type="radio" name="genero" id="generoF" value="f"><label for="generoF">Feminino</label>
        <input type="radio" name="genero" id="generoI" value="i"><label for="generoI">Não informar</label>
<br><br>
      <button type="submit">Enviar</button>
    </form>

</body>
</html>
