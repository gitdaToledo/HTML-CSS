<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFrames - exercicios</title>

    <style>
        h1, ul{
            text-align: center;
            
        }

        a{
            text-decoration: none;
            font-size: 18px;
            color:black
        }
        a:hover{
            color:darkblue;
        }

        iframe{
            display: flex;
            margin: auto;
        }
    </style>
</head>
<body>
    
<h1>Navegação com iFrame</h1>
<ul type="none">
<li><a href="pag1.html" target="frame">Página 1</a></li>
<li><a href="pag2.html" target="frame">Página 2</a></li>
<li><a href="pag3.html" target="frame">Página 3</a></li>
</ul>
<br>

<iframe src="capa.html" width="500px" height="550px" name="frame"></iframe>

</body>
</html>
